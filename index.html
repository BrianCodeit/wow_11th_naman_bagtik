<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOOWWROADTO1YEAR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e8f5e9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Baloo 2", cursive;
      padding: 16px;
      text-align: center;
    }

    h1 {
      color: #2e7d32;
      font-size: clamp(1.4rem, 5vw, 2rem);
      margin-bottom: 8px;
    }

    .hint {
      color: #388e3c;
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      margin-bottom: 20px;
    }

    .bouquet {
      position: relative;
      width: min(250px, 80vw);
      height: min(350px, 70vh);
      cursor: pointer;
      touch-action: manipulation;
    }

    .vase {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      height: 26%;
      background: #6d4c41;
      border-radius: 8px 8px 30px 30px;
    }

    .stem {
      position: absolute;
      bottom: 22%;
      width: 2%;
      background: #2e7d32;
      border-radius: 3px;
    }

    .stem1 { left: 36%; height: 34%; transform: rotate(-15deg); }
    .stem2 { left: 48%; height: 40%; }
    .stem3 { left: 60%; height: 33%; transform: rotate(15deg); }

    .flower {
      position: absolute;
      width: 30%;
      height: 24%;
      transition: transform 0.35s ease;
    }

    .flower1 { top: 23%; left: 8%; }
    .flower2 { top: 18%; left: 28%; }
    .flower3 { top: 22%; left: 47%; }

    .petal {
      position: absolute;
      width: 40%;
      height: 40%;
      border-radius: 50% 0;
      top: 50%;
      left: 50%;
    }

    .petal1 { transform: rotate(0deg)   translate(-50%, -50%); }
    .petal2 { transform: rotate(72deg)  translate(-50%, -50%); }
    .petal3 { transform: rotate(144deg) translate(-50%, -50%); }
    .petal4 { transform: rotate(216deg) translate(-50%, -50%); }
    .petal5 { transform: rotate(288deg) translate(-50%, -50%); }

    .flower1 .petal { background: #e53935; }
    .flower2 .petal { background: #ec407a; }
    .flower3 .petal { background: #ab47bc; }

    .center {
      position: absolute;
      width: 30%;
      height: 30%;
      background: #fbc02d;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .bouquet.clicked .flower {
      transform: scale(1.3);
    }

    .msg {
      margin-top: 18px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: #1b5e20;
      min-height: 1.4em;
      font-weight: 500;
    }

    @media (max-width: 400px) {
      .bouquet {
        width: 85vw;
        height: 65vh;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 8px;
      }
      .bouquet {
        width: min(200px, 45vw);
        height: min(280px, 75vh);
      }
      h1 {
        font-size: 1.2rem;
      }
      .hint {
        margin-bottom: 10px;
      }
    }

    button {
        font-family: "Baloo 2", cursive;
        cursor: pointer;
        font-size: clamp(1rem, 4vw, 1.2rem);
        padding: 1px 5px;
        margin: 0;
        border-radius: 100px;
        transition: 0.3s;
        font-weight: bolder;
        color: #1b5e20;
        border: none;
    }

  </style>
</head>
<body>

  <h1>For youu😜😜😜</h1>
  <p class="hint">unsaon diay para makita ang message?</p>

  <div class="bouquet" id="bouquet">

    <div class="stem stem1"></div>
    <div class="stem stem2"></div>
    <div class="stem stem3"></div>

   
    <div class="flower flower1">
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
      <div class="petal petal5"></div>
      <div class="center"></div>
    </div>

   
    <div class="flower flower2">
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
      <div class="petal petal5"></div>
      <div class="center"></div>
    </div>

   
    <div class="flower flower3">
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
      <div class="petal petal5"></div>
      <div class="center"></div>
    </div>

  
    <div class="vase"></div>
  </div>

  <div class="msg" id="msg"></div>

  <button id="message"></button>


  <script>
    const bouquet = document.getElementById('bouquet');
    const msg = document.getElementById('message');
    const nextBtn = document.getElementById('nextBtn');

    bouquet.addEventListener('click', function () {
    bouquet.classList.add('clicked');

        msg.textContent = "Ay wow nakahibaw sya, okay pindota ko";

        nextBtn.style.display = "block";
});

    msg.addEventListener('click', function () {
        window.location.href = "msg.html";
    });

  </script>

</body>
</html>
